name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A DLL do mod precisa do checkout do UE4SS, que não está disponível aqui.
  # O que o CI cobre é a camada que o projeto isola de propósito: config,
  # catálogo e decisão de troca. É exatamente onde os bugs de lógica moram.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: ${{ runner.os }}-xmake-${{ hashFiles('xmake.lua') }}

      - name: Configure
        run: xmake f -y -m release

      - name: Build tests
        run: xmake build -y tests

      - name: Run tests
        run: xmake run tests

  # Compila a DLL de verdade e publica o pacote pronto para extrair. É o que
  # torna o mod instalável sem o usuário montar toolchain: baixa o artefato,
  # extrai em ue4ss\Mods\, pronto.
  #
  # O UE4SS é compilado junto (é o fluxo suportado; não existe import library
  # publicada), então este job é lento e é o primeiro a quebrar quando o UE4SS
  # muda. Por isso a tag é fixa em vez de main.
  mod-dll:
    name: mod DLL (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout RE-UE4SS
        run: |
          git clone --recursive --depth 1 --branch v3.0.1 https://github.com/UE4SS-RE/RE-UE4SS external/RE-UE4SS

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: Repertoire33
          path: build/dist/*.zip
          if-no-files-found: error
