name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A DLL do mod precisa do checkout do UE4SS, que não está disponível aqui.
  # O que o CI cobre é a camada que o projeto isola de propósito: config,
  # catálogo e decisão de troca. É exatamente onde os bugs de lógica moram.
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: ${{ runner.os }}-xmake-${{ hashFiles('xmake.lua') }}

      - name: Configure
        run: xmake f -y -m release

      - name: Build tests
        run: xmake build -y tests

      - name: Run tests
        run: xmake run tests

  # Compila a DLL e publica o zip pronto para extrair. Sem segredo e sem
  # dependencia privada: toda a stack (ImGui, MinHook, nlohmann) e publica.
  mod-dll:
    name: mod DLL (windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt') }}

      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: Repertoire33
          path: build/dist/*.zip
          if-no-files-found: error

      - name: Publicar release na tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.zip
